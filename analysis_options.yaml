include: package:flutter_lints/flutter.yaml

# Keep Flutter analyzer errors and functional warnings enabled.
# These two newer cosmetic style checks should not prevent APK compilation
# while the development branch is being made installable.
analyzer:
  errors:
    deprecated_member_use: ignore

linter:
  rules:
    prefer_interpolation_to_compose_strings: false
    use_null_aware_elements: false
