name: Recipe Haven Android — Development Checks

on:
  workflow_dispatch:
  push:
    branches: [feature/ingredient-products-and-cookbook-backup]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Android project
        run: bash scripts/bootstrap_android.sh
      - name: Flutter static analysis
        run: flutter analyze
      - name: Flutter tests
        run: flutter test
      - name: Compile Android Stable app for CI only
        shell: bash
        run: |
          set -euo pipefail
          # Never distribute a debug-signed build with the Stable app ID.
          flutter build apk --debug --flavor babeStable --dart-define=EDITION=babe
          test -s build/app/outputs/flutter-apk/app-babestable-debug.apk
          echo "Android source compiles. Debug artifact intentionally NOT published."
