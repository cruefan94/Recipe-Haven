name: Build Android — Babe Only (Test)

on:
  workflow_dispatch:
  push:
    branches: [main, feature/ingredient-products-and-cookbook-backup]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Generate Android project and independent editions
        run: bash scripts/bootstrap_android.sh
      - name: Static analysis
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Babe Android test APK
        shell: bash
        run: |
          set -euo pipefail
          code=$((20000 + GITHUB_RUN_NUMBER))
          flutter build apk --debug --flavor babe --dart-define=EDITION=babe --build-number="$code"
      - name: Label APKs
        run: |
          mkdir -p release-test
          cp build/app/outputs/flutter-apk/app-babe-debug.apk release-test/Babe-Android-TEST.apk
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: RecipeHaven-Babe-Android-TEST-APK
          path: release-test/*.apk
          retention-days: 30
