name: Recipe Haven — Fresh Android APK (Signed Test)

on:
  push:
    branches: [feature/ingredient-products-and-cookbook-backup]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recipe-haven-fresh-apk
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout Recipe Haven
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate single-app Android project
        run: bash scripts/bootstrap_android.sh
      - name: Flutter static analysis
        run: flutter analyze
      - name: Flutter unit tests
        run: flutter test
      - name: Load the existing permanent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RECIPE_HAVEN_RELEASE_KEYSTORE_B64 }}
          RECIPE_HAVEN_RELEASE_STORE_PASSWORD: ${{ secrets.RECIPE_HAVEN_RELEASE_STORE_PASSWORD }}
          RECIPE_HAVEN_RELEASE_KEY_ALIAS: ${{ secrets.RECIPE_HAVEN_RELEASE_KEY_ALIAS }}
          RECIPE_HAVEN_RELEASE_KEY_PASSWORD: ${{ secrets.RECIPE_HAVEN_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 RECIPE_HAVEN_RELEASE_STORE_PASSWORD RECIPE_HAVEN_RELEASE_KEY_ALIAS RECIPE_HAVEN_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing Android signing secret: $name"
              exit 1
            fi
          done
          key="$RUNNER_TEMP/recipe-haven-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          keytool -list -keystore "$key" -alias "$RECIPE_HAVEN_RELEASE_KEY_ALIAS" \
            -storepass:env RECIPE_HAVEN_RELEASE_STORE_PASSWORD >/dev/null
          echo "RECIPE_HAVEN_RELEASE_KEYSTORE=$key" >> "$GITHUB_ENV"
      - name: Compile new signed Recipe Haven APK
        shell: bash
        env:
          RECIPE_HAVEN_RELEASE_LINT_WORKAROUND: '1'
          RECIPE_HAVEN_RELEASE_STORE_PASSWORD: ${{ secrets.RECIPE_HAVEN_RELEASE_STORE_PASSWORD }}
          RECIPE_HAVEN_RELEASE_KEY_ALIAS: ${{ secrets.RECIPE_HAVEN_RELEASE_KEY_ALIAS }}
          RECIPE_HAVEN_RELEASE_KEY_PASSWORD: ${{ secrets.RECIPE_HAVEN_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version=$((50000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          flutter build apk --release --build-name=1.0.0 --build-number="$version"
      - name: Verify package ID and permanent signing certificate
        shell: bash
        env:
          RECIPE_HAVEN_RELEASE_STORE_PASSWORD: ${{ secrets.RECIPE_HAVEN_RELEASE_STORE_PASSWORD }}
          RECIPE_HAVEN_RELEASE_KEY_ALIAS: ${{ secrets.RECIPE_HAVEN_RELEASE_KEY_ALIAS }}
        run: bash scripts/verify_android_release.sh build/app/outputs/flutter-apk/app-release.apk
      - name: Prepare new downloadable APK
        shell: bash
        run: |
          mkdir -p release-test
          cp build/app/outputs/flutter-apk/app-release.apk \
            release-test/Recipe-Haven-Android-FRESH-INSTALL.apk
      - name: Upload fresh-install signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Recipe-Haven-Android-FRESH-INSTALL
          path: release-test/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove private key from runner
        if: always()
        shell: bash
        run: |
          if [[ -n "${RECIPE_HAVEN_RELEASE_KEYSTORE:-}" && -f "$RECIPE_HAVEN_RELEASE_KEYSTORE" ]]; then
            rm -f "$RECIPE_HAVEN_RELEASE_KEYSTORE"
          fi
