name: Recipe Haven — Professional and Full Android Test APKs

on:
  push:
    branches: [feature/ingredient-products-and-cookbook-backup]
  workflow_dispatch:

permissions:
  contents: read

# New pushes supersede older test builds so both editions come from one commit.
concurrency:
  group: recipe-haven-two-editions-test-apks
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout Recipe Haven
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Prepare Professional and Full Android variants
        run: bash scripts/bootstrap_android.sh
      - name: Flutter static analysis
        run: flutter analyze
      - name: Flutter unit tests
        run: flutter test
      - name: Load the existing permanent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RECIPE_HAVEN_RELEASE_KEYSTORE_B64 }}
          RECIPE_HAVEN_RELEASE_STORE_PASSWORD: ${{ secrets.RECIPE_HAVEN_RELEASE_STORE_PASSWORD }}
          RECIPE_HAVEN_RELEASE_KEY_ALIAS: ${{ secrets.RECIPE_HAVEN_RELEASE_KEY_ALIAS }}
          RECIPE_HAVEN_RELEASE_KEY_PASSWORD: ${{ secrets.RECIPE_HAVEN_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 RECIPE_HAVEN_RELEASE_STORE_PASSWORD RECIPE_HAVEN_RELEASE_KEY_ALIAS RECIPE_HAVEN_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing Android signing secret: $name"
              exit 1
            fi
          done
          key="$RUNNER_TEMP/recipe-haven-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          keytool -list -keystore "$key" -alias "$RECIPE_HAVEN_RELEASE_KEY_ALIAS" \
            -storepass:env RECIPE_HAVEN_RELEASE_STORE_PASSWORD >/dev/null
          echo "RECIPE_HAVEN_RELEASE_KEYSTORE=$key" >> "$GITHUB_ENV"
      - name: Compile signed Professional and Full Android APKs
        shell: bash
        env:
          RECIPE_HAVEN_RELEASE_LINT_WORKAROUND: '1'
          RECIPE_HAVEN_RELEASE_STORE_PASSWORD: ${{ secrets.RECIPE_HAVEN_RELEASE_STORE_PASSWORD }}
          RECIPE_HAVEN_RELEASE_KEY_ALIAS: ${{ secrets.RECIPE_HAVEN_RELEASE_KEY_ALIAS }}
          RECIPE_HAVEN_RELEASE_KEY_PASSWORD: ${{ secrets.RECIPE_HAVEN_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version=$((50000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          for edition in professional full; do
            flutter build apk --release --flavor "$edition" \
              --dart-define="RECIPE_HAVEN_EDITION=$edition" \
              --build-name=1.0.0 --build-number="$version"
          done
      - name: Verify both package IDs and permanent signing certificates
        shell: bash
        env:
          RECIPE_HAVEN_RELEASE_STORE_PASSWORD: ${{ secrets.RECIPE_HAVEN_RELEASE_STORE_PASSWORD }}
          RECIPE_HAVEN_RELEASE_KEY_ALIAS: ${{ secrets.RECIPE_HAVEN_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          bash scripts/verify_android_release.sh \
            build/app/outputs/flutter-apk/app-professional-release.apk \
            com.cruefan94.recipe_haven
          bash scripts/verify_android_release.sh \
            build/app/outputs/flutter-apk/app-full-release.apk \
            com.cruefan94.recipe_haven.full
      - name: Prepare separately named APK downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-test
          cp build/app/outputs/flutter-apk/app-professional-release.apk \
            release-test/Recipe-Haven-Professional-Android-TEST.apk
          cp build/app/outputs/flutter-apk/app-full-release.apk \
            release-test/Recipe-Haven-Full-Android-TEST.apk
      - name: Generate and validate edition-specific Word quick-start guides
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "python-docx==1.2.0"
          python scripts/generate_android_guides.py release-test
          python - <<'PY'
          from pathlib import Path
          from docx import Document

          for edition in ("Professional", "Full"):
              apk = Path(f"release-test/Recipe-Haven-{edition}-Android-TEST.apk")
              guide = Path(f"release-test/Recipe-Haven-{edition}-Android-Quick-Start.docx")
              assert apk.is_file() and apk.stat().st_size > 1000000, apk
              assert guide.is_file() and guide.stat().st_size > 1000, guide
              paragraphs = [paragraph.text for paragraph in Document(guide).paragraphs]
              text = "\n".join(paragraphs)
              assert "Files by Google" in text and "Install unknown apps" in text
              assert "Find Ingredient" in text and "Shopping List" in text
              if edition == "Professional":
                  assert "Marijuana" not in text
              else:
                  assert "Marijuana Cookbook" in text and "at least 8 characters" in text
              print(f"Verified {edition} APK and Word guide")
          PY
      - name: Upload Professional Android APK and matching Word guide
        uses: actions/upload-artifact@v4
        with:
          name: Recipe-Haven-Professional-Android-TEST
          path: |
            release-test/Recipe-Haven-Professional-Android-TEST.apk
            release-test/Recipe-Haven-Professional-Android-Quick-Start.docx
          if-no-files-found: error
          retention-days: 30
      - name: Upload Full Android APK and matching Word guide
        uses: actions/upload-artifact@v4
        with:
          name: Recipe-Haven-Full-Android-TEST
          path: |
            release-test/Recipe-Haven-Full-Android-TEST.apk
            release-test/Recipe-Haven-Full-Android-Quick-Start.docx
          if-no-files-found: error
          retention-days: 30
      - name: Remove private key from runner
        if: always()
        shell: bash
        run: |
          if [[ -n "${RECIPE_HAVEN_RELEASE_KEYSTORE:-}" && -f "$RECIPE_HAVEN_RELEASE_KEYSTORE" ]]; then
            rm -f "$RECIPE_HAVEN_RELEASE_KEYSTORE"
          fi
