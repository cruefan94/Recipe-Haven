name: Babe Stable — Disposable Signing Readiness (No Release)

on:
  push:
    branches: [feature/ingredient-products-and-cookbook-backup]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter dependencies
        run: flutter pub get
      - name: Generate Android project
        run: bash scripts/bootstrap_android.sh
      - name: Generate disposable CI-only signing key
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/babe-ci-only.p12"
          pass="$(openssl rand -hex 22)"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$key" -alias babe-ci-disposable \
            -keyalg RSA -keysize 3072 -validity 2 \
            -dname "CN=Babe CI Smoke Only,O=Recipe Haven,C=CA" \
            -storepass "$pass" -keypass "$pass" > /dev/null 2>&1
          chmod 600 "$key"
          echo "RECIPE_HAVEN_RELEASE_KEYSTORE=$key" >> "$GITHUB_ENV"
          echo "RECIPE_HAVEN_RELEASE_STORE_PASSWORD=$pass" >> "$GITHUB_ENV"
          echo "RECIPE_HAVEN_RELEASE_KEY_PASSWORD=$pass" >> "$GITHUB_ENV"
          echo "RECIPE_HAVEN_RELEASE_KEY_ALIAS=babe-ci-disposable" >> "$GITHUB_ENV"
      - name: Build signed Stable for CI verification only
        shell: bash
        run: |
          set -euo pipefail
          code=$((30000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          flutter build apk --release --flavor babeStable \
            --dart-define=EDITION=babe --build-name=1.0.0 --build-number="$code"
      - name: Verify certificate and application ID
        run: bash scripts/verify_babe_release.sh build/app/outputs/flutter-apk/app-babestable-release.apk
      - name: Remove disposable signing key
        if: always()
        shell: bash
        run: |
          if [[ -n "${RECIPE_HAVEN_RELEASE_KEYSTORE:-}" && -f "$RECIPE_HAVEN_RELEASE_KEYSTORE" ]]; then
            rm -f "$RECIPE_HAVEN_RELEASE_KEYSTORE"
          fi
          echo "Disposable signed APK is intentionally NOT uploaded or distributed."
