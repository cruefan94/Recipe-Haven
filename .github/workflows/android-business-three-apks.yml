name: Android Business Apps — Three Independent Test APKs
on:
  push:
    branches:
      - feature/three-business-android-apk-parity-20261121
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: business-app-test-apks
  cancel-in-progress: true
jobs:
  compile-test-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: tradesman_pro
            package_id: com.cruefan94.tradesman_pro
            artifact: Tradesman-Pro-Android-TEST
          - app: jobproof
            package_id: com.cruefan94.jobproof
            artifact: JobProof-Android-TEST
          - app: rental_inspector
            package_id: com.cruefan94.rental_inspector
            artifact: Rental-Inspector-Android-TEST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze and test independent app
        shell: bash
        run: |
          set -euo pipefail
          cd "examples/${{ matrix.app }}"
          flutter pub get
          flutter analyze
          flutter test
      - name: Bootstrap Android-only application
        shell: bash
        run: bash scripts/bootstrap_business_android.sh "${{ matrix.app }}"
      - name: Build independent Android test APK
        shell: bash
        run: |
          set -euo pipefail
          cd "examples/${{ matrix.app }}"
          # Template release signing uses a disposable Android debug keystore.
          # Test-only APK. Never claim upgrade continuity or production signing.
          flutter build apk --release --build-name=0.5.0 --build-number=$((60000+GITHUB_RUN_NUMBER))
      - name: Verify package identity, APK signature, and file digest
        shell: bash
        run: |
          set -euo pipefail
          app="examples/${{ matrix.app }}"
          apk="$app/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt="$(find "$sdk/build-tools" -type f -name aapt | sort -V | tail -1)"
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$aapt" && test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          "$aapt" dump badging "$apk" | grep "^package: name='${{ matrix.package_id }}'"
          mkdir -p release-test
          cp "$apk" "release-test/${{ matrix.artifact }}.apk"
          (cd release-test && sha256sum "${{ matrix.artifact }}.apk" > "${{ matrix.artifact }}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-test/
          retention-days: 30
          if-no-files-found: error
