name: Signed Android APKs — Manual Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RECIPE_HAVEN_RELEASE_STORE_PASSWORD: ${{ secrets.RECIPE_HAVEN_RELEASE_STORE_PASSWORD }}
      RECIPE_HAVEN_RELEASE_KEY_ALIAS: ${{ secrets.RECIPE_HAVEN_RELEASE_KEY_ALIAS }}
      RECIPE_HAVEN_RELEASE_KEY_PASSWORD: ${{ secrets.RECIPE_HAVEN_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout Recipe Haven
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Generate Android source
        run: bash scripts/bootstrap_android.sh
      - name: Install permanent release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RECIPE_HAVEN_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 RECIPE_HAVEN_RELEASE_STORE_PASSWORD RECIPE_HAVEN_RELEASE_KEY_ALIAS RECIPE_HAVEN_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing signed-release GitHub secret: $name"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/recipe-haven-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "RECIPE_HAVEN_RELEASE_KEYSTORE=$keystore" >> "$GITHUB_ENV"
      - name: Build both signed Android APK editions
        shell: bash
        run: |
          set -euo pipefail
          code=$((10000 + GITHUB_RUN_NUMBER))
          flutter build apk --release --flavor momdad --dart-define=EDITION=momdad --build-number="$code"
          flutter build apk --release --flavor babe --dart-define=EDITION=babe --build-number="$code"
      - name: Collect APK files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-signed
          cp build/app/outputs/flutter-apk/app-momdad-release.apk release-signed/For-Mom-and-Dad-Android-SIGNED.apk
          cp build/app/outputs/flutter-apk/app-babe-release.apk release-signed/Babe-Android-SIGNED.apk
      - name: Publish signed APK artifacts for manual review
        uses: actions/upload-artifact@v4
        with:
          name: RecipeHaven-SIGNED-ANDROID-UNVERIFIED
          path: release-signed/*.apk
          if-no-files-found: error
          retention-days: 30
